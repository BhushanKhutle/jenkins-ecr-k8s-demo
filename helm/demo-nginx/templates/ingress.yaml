apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-http
spec:
  tls:
  - hosts:
    - k8stesting-647846595.ap-south-1.elb.amazonaws.com
    secretName: demo-nginx-tls

  rules:
  - host: k8stesting-647846595.ap-south-1.elb.amazonaws.com
    http:
      paths:
      - path: /demo
        pathType: Prefix
        backend:
          service:
            name: demo-nginx
            port:
              number: 80

